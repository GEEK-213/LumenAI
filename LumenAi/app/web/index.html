<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LumenAI — AI-powered lecture analysis, study tools, and voice tutoring for students.">
  <meta name="theme-color" content="#050B18">

  <!-- Open Graph -->
  <meta property="og:title" content="LumenAI — Smart Study Assistant">
  <meta property="og:description" content="Upload lectures, get AI summaries, flashcards, quizzes, mind maps, podcasts, and voice tutoring.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LumenAI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LumenAI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading spinner */
    body { background: #050B18; margin: 0; }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    .loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(68, 138, 255, 0.2);
      border-top: 4px solid #448AFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading p {
      color: rgba(255, 255, 255, 0.5);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin-top: 16px;
      font-size: 14px;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading LumenAI...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
